<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef5e9" />
    <meta name="description" content="A little bird's-eye view of the things in progress." />
    <title>The Aviary Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="masthead">
        <div class="masthead-copy">
          <p class="eyebrow"><span class="eyebrow-dot"></span> A small, steady update</p>
          <h1>The Aviary Log</h1>
          <p class="intro">A bird's-eye view of every little thing in progress.</p>
        </div>
        <figure class="bird-photo">
          <img
            src="https://images.pexels.com/photos/36621584/pexels-photo-36621584.jpeg?auto=compress&cs=tinysrgb&w=960"
            alt="Two Java sparrows bathing among rocks and green leaves"
          />
          <figcaption>a little java sparrow pair</figcaption>
        </figure>
        <span class="floating-bird" aria-hidden="true">✿</span>
      </header>

      <section class="dashboard" aria-labelledby="progress-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow section-kicker">Your little flock</p>
            <h2 id="progress-heading">Progress</h2>
          </div>
          <p class="result-count" id="result-count" aria-live="polite"></p>
        </div>

        <div class="filter-panel">
          <div class="filter-topline">
            <h3>Find a feather</h3>
            <button class="clear-button" id="clear-filters" type="button">Clear filters</button>
          </div>
          <div class="filter-groups" id="filter-groups"></div>
        </div>

        <div class="progress-list" id="progress-list" aria-live="polite"></div>
      </section>

      <footer class="page-footer">
        <span class="footer-bird" aria-hidden="true">✳</span>
        <p>Made for the joy of watching things grow.</p>
        <span class="footer-note">A quiet little dashboard</span>
      </footer>
    </main>
  </body>
</html>
